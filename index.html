<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Back to Fit</title>
  <meta name="theme-color" content="#1B1816">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Back to Fit">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg: #1B1816;
      --s: #26221E;
      --s2: #2E2822;
      --line: #3C352C;
      --ink: #EFE8DA;
      --dim: #BDB2A0;
      --faint: #9A907F;
      --iron: #C1443D;
      --brass: #B08D4F;
      --green: #7C9B5C;
      --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 var(--f);
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 0 calc(110px + env(safe-area-inset-bottom, 0px))
    }

    h1,
    h2,
    h3 {
      margin: 0 0 8px;
      font-weight: 700;
      letter-spacing: .01em
    }

    h1 {
      font-size: 22px
    }

    h2 {
      font-size: 18px
    }

    h3 {
      font-size: 15px
    }

    p {
      margin: 0 0 10px;
      color: var(--dim)
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 14px
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 14px 6px;
      max-width: 480px;
      margin: 0 auto
    }

    header h1::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--iron);
      margin-right: 8px
    }

    header span {
      font-size: 12px;
      color: var(--faint)
    }

    .panel {
      display: none
    }

    .panel.on {
      display: block
    }

    button {
      font-family: var(--f);
      cursor: pointer
    }

    input,
    select,
    textarea {
      font: 16px var(--f);
      width: 100%;
      background: var(--s2);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 8px;
      padding: 10px
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--iron)
    }

    /* nav */
    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: center;
      z-index: 30
    }

    nav div {
      display: flex;
      gap: 2px;
      background: rgba(38, 34, 30, .94);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4)
    }

    nav button {
      background: none;
      border: 0;
      color: var(--faint);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 20px;
      border-radius: 24px;
      font-size: 12px;
      min-height: 48px
    }

    nav svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8
    }

    nav button.on {
      background: var(--s2);
      color: var(--ink)
    }

    nav button.on svg {
      stroke: var(--iron)
    }

    .seg {
      display: flex;
      gap: 6px;
      background: var(--s2);
      border-radius: 24px;
      padding: 4px;
      margin: 4px 0 14px
    }

    .seg button {
      flex: 1;
      background: none;
      border: 0;
      color: var(--faint);
      font-size: 14px;
      font-weight: 600;
      padding: 11px 0;
      border-radius: 20px
    }

    .seg button.active {
      background: var(--ink);
      color: var(--bg)
    }

    .card {
      background: var(--s);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .sp {
      justify-content: space-between
    }

    .primary {
      width: 100%;
      background: var(--iron);
      color: #fff;
      border: 0;
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      border-radius: 10px;
      margin-top: 6px
    }

    .secondary {
      width: 100%;
      background: none;
      color: var(--dim);
      border: 1px solid var(--line);
      font-size: 14px;
      padding: 12px;
      border-radius: 10px;
      margin-top: 8px
    }

    .danger {
      color: var(--iron);
      border-color: var(--iron)
    }

    .link {
      background: none;
      border: 0;
      color: var(--brass);
      font-size: 13px;
      padding: 8px 0
    }

    .empty {
      color: var(--faint);
      text-align: center;
      padding: 22px 8px;
      font-size: 14px
    }

    /* folders */
    .fold {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--s);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 600;
      text-align: left;
      min-height: 56px
    }

    .fold small {
      margin-left: auto;
      color: var(--faint);
      font-weight: 400;
      font-size: 13px
    }

    .fold svg {
      width: 22px;
      height: 22px;
      stroke: var(--brass);
      fill: none;
      stroke-width: 1.8;
      flex: none
    }

    .fold .ch {
      transition: transform .2s;
      stroke: var(--faint);
      width: 18px;
      height: 18px
    }

    .fold.open {
      border-color: var(--iron);
      border-radius: 12px 12px 0 0
    }

    .fold.open .ch {
      transform: rotate(90deg)
    }

    .kids {
      background: var(--s);
      border: 1px solid var(--iron);
      border-top: 0;
      border-radius: 0 0 12px 12px;
      padding: 8px;
      margin-bottom: 12px;
      display: grid;
      gap: 6px
    }

    .fw {
      margin-bottom: 10px
    }

    .fw .fold.open {
      margin-bottom: 0
    }

    .fw .kids {
      margin-bottom: 0
    }

    .wk {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: var(--s2);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 9px;
      padding: 13px 14px;
      font-size: 15px;
      min-height: 48px
    }

    .wk em {
      font-style: normal;
      font-size: 11px;
      color: var(--brass)
    }

    .add {
      background: none;
      border: 1px dashed var(--line);
      color: var(--dim);
      border-radius: 9px;
      padding: 12px;
      font-size: 14px;
      min-height: 46px;
      width: 100%
    }

    /* workout */
    .pill {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + 4px);
      z-index: 20;
      background: var(--s2);
      border: 1px solid var(--iron);
      border-radius: 20px;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 12px
    }

    .ex {
      border-bottom: 1px solid var(--line);
      padding: 12px 0
    }

    .ex:last-of-type {
      border: 0
    }

    .ex .nm {
      background: none;
      border: 0;
      color: var(--ink);
      font-weight: 700;
      font-size: 16px;
      padding: 0;
      text-align: left
    }

    .meta {
      font-size: 13px;
      color: var(--faint);
      margin: 2px 0 8px
    }

    .sl {
      display: grid;
      grid-template-columns: 44px 1fr 1fr 44px;
      gap: 8px;
      align-items: center;
      padding: 4px 2px;
      border-radius: 8px;
      margin-bottom: 4px
    }

    .sl.hd span {
      font-size: 12px;
      color: var(--faint);
      text-align: center
    }

    .sl.d {
      background: rgba(124, 155, 92, .16)
    }

    .sl input {
      text-align: center;
      padding: 10px 4px
    }

    .b,
    .ck {
      height: 44px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--s2);
      color: var(--dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      user-select: none
    }

    .b.w {
      background: rgba(176, 141, 79, .2);
      border-color: var(--brass);
      color: var(--brass)
    }

    .ck.d {
      background: var(--green);
      border-color: var(--green);
      color: #fff
    }

    /* history */
    .h {
      margin-bottom: 12px;
      position: relative
    }

    .h h3 {
      font-size: 17px;
      margin: 0
    }

    .h .dt {
      font-size: 13px;
      color: var(--faint);
      margin-bottom: 10px
    }

    .h .hr {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      color: var(--dim);
      padding: 3px 0
    }

    .h .hr b {
      color: var(--ink);
      white-space: nowrap
    }

    .h .ft {
      font-size: 13px;
      color: var(--faint);
      margin-top: 10px
    }

    .x {
      position: absolute;
      top: 6px;
      right: 6px;
      background: none;
      border: 0;
      color: var(--faint);
      font-size: 22px;
      width: 44px;
      height: 44px
    }

    /* eat */
    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 12px;
      padding-bottom: 4px
    }

    .chips button {
      flex: none;
      background: var(--s);
      border: 1px solid var(--line);
      color: var(--dim);
      border-radius: 20px;
      padding: 9px 15px;
      font-size: 14px
    }

    .chips button.on {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    .tag {
      font-size: 12px;
      padding: 2px 9px;
      border-radius: 20px;
      background: rgba(176, 141, 79, .18);
      color: var(--brass)
    }

    .meal {
      cursor: pointer
    }

    .meal h3 {
      margin: 0
    }

    .meal .ds {
      color: var(--dim);
      font-size: 14px;
      margin: 4px 0
    }

    .meal .nu {
      font-size: 13px;
      color: var(--faint)
    }

    .meal .more {
      display: none;
      border-top: 1px solid var(--line);
      margin-top: 10px;
      padding-top: 10px;
      white-space: pre-wrap;
      color: var(--ink);
      font-size: 14px
    }

    .meal.open .more {
      display: block
    }

    .si {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
      min-height: 50px
    }

    .si:last-child {
      border: 0
    }

    .si input {
      width: 22px;
      height: 22px;
      accent-color: var(--brass);
      flex: none;
      padding: 0
    }

    .si span {
      flex: 1
    }

    .si.c span {
      color: var(--faint);
      text-decoration: line-through
    }

    .si b {
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--dim)
    }

    /* progress */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr)
    }

    .stats div {
      text-align: center;
      border-left: 1px solid var(--line)
    }

    .stats div:first-child {
      border: 0
    }

    .stats b {
      display: block;
      font-size: 22px
    }

    .stats span {
      font-size: 13px;
      color: var(--faint)
    }

    .hm {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 6px;
      align-items: stretch
    }

    .hm .wd {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      gap: 3px;
      font-size: 10px;
      color: var(--faint);
      line-height: 1
    }

    .hm .wd span {
      display: flex;
      align-items: center
    }

    .hm .g {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      grid-template-columns: repeat(22, 1fr);
      grid-auto-flow: column;
      gap: 3px
    }

    .g i {
      aspect-ratio: 1;
      border-radius: 3px;
      background: var(--s2)
    }

    .l1 {
      background: rgba(193, 68, 61, .3) !important
    }

    .l2 {
      background: rgba(193, 68, 61, .55) !important
    }

    .l3 {
      background: rgba(193, 68, 61, .8) !important
    }

    .l4 {
      background: #E2574F !important
    }

    .nx {
      background: none !important
    }

    .mo {
      display: grid;
      grid-template-columns: repeat(22, 1fr);
      gap: 3px;
      margin: 0 0 6px 38px;
      font-size: 11px;
      color: var(--faint);
      height: 14px
    }

    .mo span {
      white-space: nowrap
    }

    .lg {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 13px;
      color: var(--faint)
    }

    .lg i {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: var(--s2);
      margin: 0 2px;
      vertical-align: -1px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px
    }

    td,
    th {
      text-align: left;
      padding: 10px 4px;
      border-bottom: 1px solid var(--line);
      color: var(--dim)
    }

    th {
      font-size: 12px;
      color: var(--faint)
    }

    .n {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    tr:last-child td {
      border: 0
    }

    /* modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center
    }

    .sheet {
      background: var(--s);
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow: auto;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px))
    }

    .sheet label {
      display: block;
      font-size: 13px;
      color: var(--faint);
      margin-bottom: 10px
    }

    .sheet label input,
    .sheet label select,
    .sheet label textarea {
      margin-top: 4px;
      color: var(--ink)
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }
  </style>
</head>

<body>
  <header>
    <h1>Back to Fit</h1><span id="today"></span>
  </header>
  <main class="wrap">

    <section id="p-train" class="panel on">
      <div class="seg" id="seg-train">
        <button class="active" data-view="Workouts">Workouts</button>
        <button data-view="History">History</button>
      </div>
      <div id="v-Workouts"></div>
      <div id="v-History" style="display:none"></div>
    </section>

    <section id="p-eat" class="panel">
      <div class="seg" id="seg-eat">
        <button class="active" data-view="Meals">Meals</button>
        <button data-view="Shop">Shop</button>
      </div>
      <div id="v-Meals"></div>
      <div id="v-Shop" style="display:none"></div>
    </section>

    <section id="p-prog" class="panel"></section>
  </main>

  <nav>
    <div>
      <button data-tab="train" class="on"><svg viewBox="0 0 24 24">
          <path d="M4 12h16" />
          <rect x="2" y="9" width="3" height="6" rx="1" />
          <rect x="19" y="9" width="3" height="6" rx="1" />
          <rect x="6" y="7" width="2.5" height="10" rx="1" />
          <rect x="15.5" y="7" width="2.5" height="10" rx="1" />
        </svg>Train</button>
      <button data-tab="eat"><svg viewBox="0 0 24 24">
          <path d="M7 2v8a2 2 0 0 0 4 0V2M9 10v12M15 2c0 3-2 4-2 7s2 3 2 3v10" />
        </svg>Eat</button>
      <button data-tab="prog"><svg viewBox="0 0 24 24">
          <polyline points="3 17 9 11 13 15 21 6" />
          <polyline points="14 6 21 6 21 13" />
        </svg>Progress</button>
    </div>
  </nav>

  <script>
    /* ===== helpers ===== */
    const $ = s => document.querySelector(s), uid = () => Math.random().toString(36).slice(2, 9);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
    const dk = d => { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') };
    const fmtDur = ms => { const m = Math.round(ms / 6e4), h = Math.floor(m / 60); return (h ? h + 'h ' : '') + (m % 60) + 'm' };
    const fmtVol = v => v >= 1000 ? +(v / 1000).toPrecision(3) + 'K' : Math.round(v) + '';
    const clock = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') };
    const nums = r => (String(r).match(/\d+/g) || [8]).map(Number);
    const hiR = r => Math.max(...nums(r)), loR = r => Math.min(...nums(r));

    /* ===== data ===== */
    const mk = (n, l) => ({ id: uid(), n, ex: l.map(([n, s, r, w, inc]) => ({ id: uid(), n, s, r, w, inc, h: 0, f: 0, last: null })) });
    function seed() {
      let bw = []; try { bw = JSON.parse(localStorage.getItem('rti:bw-log')) || [] } catch (e) { }
      return {
        v: 2, cur: 'EUR', open: null, sess: null, hist: [], bw,
        folders: [
          {
            n: 'Upper', w: [
              mk('Upper A', [['Barbell Bench Press', 4, '6-8', 30, 2.5], ['Lat Pulldown', 4, '8-10', 40, 5], ['Seated Cable Row', 3, '10-12', 32, 5], ['Dumbbell Overhead Press', 3, '8-10', 9, 2], ['Dumbbell Lateral Raise', 3, '12-15', 6, 2], ['Triceps Pushdown', 3, '10-12', 32, 5], ['Hanging Leg Raise', 3, '10-15', 0, 0]]),
              mk('Upper B', [['Incline Dumbbell Press', 4, '8-10', 10, 2], ['Pull-Up', 4, '6-10', 0, 0], ['Chest Dip', 3, '8-12', 0, 0], ['One-Arm Dumbbell Row', 3, '8-10', 16, 2], ['Machine Shoulder Press', 3, '10-12', 30, 5], ['Face Pull (Cable)', 3, '12-15', 20, 5], ['Preacher Curl', 3, '10-12', 20, 2.5], ['Plank (sec)', 3, '30-45', 0, 0]])]
          },
          {
            n: 'Lower', w: [
              mk('Lower A', [['Barbell Back Squat', 4, '6-8', 40, 5], ['Romanian Deadlift', 3, '8-10', 60, 5], ['Leg Press', 3, '10-12', 80, 10], ['Seated Leg Curl', 3, '10-12', 20, 5], ['Standing Calf Raise', 3, '12-15', 30, 5], ['Cable Crunch', 3, '12-15', 20, 5]]),
              mk('Lower B', [['Deadlift', 4, '5', 60, 5], ['Walking Lunge', 3, '10', 10, 2], ['Leg Extension', 3, '12-15', 25, 5], ['Seated Calf Raise', 3, '12-15', 20, 5], ['Weighted Plank (sec)', 3, '30-45', 0, 0]])]
          },
          { n: 'Folder 3', w: [] }, { n: 'Folder 4', w: [] }],
        meals: [
          { id: uid(), n: 'Breakfast', d: 'Eggs, oats, milk and a banana', tag: 'Breakfast', kcal: 555, p: 29, det: '2 eggs\n220ml half-fat milk\n50g oats\n1 banana' },
          { id: uid(), n: 'Chicken, rice & veg', d: 'Packable lunch. Swap the carb for variety.', tag: 'Lunch', kcal: 435, p: 41, det: '150g chicken breast (raw weight), cooked\n150g rice or potato, cooked\nVegetables + 1 tsp olive oil' },
          { id: uid(), n: 'Oat & quark shake', d: 'Blended backup for rushed mornings or after training', tag: 'Snack', kcal: 535, p: 33, det: '40g oats\n250ml milk\n1 banana\n150g low-fat quark\n1 tbsp peanut butter (optional)\n\nBlend oats + milk first for a minute, then add the rest.' }],
        shop: []
      };
    }
    let DB;
    try { DB = JSON.parse(localStorage.getItem('btf2')) || seed() } catch (e) { DB = seed() }
    const save = () => { try { localStorage.setItem('btf2', JSON.stringify(DB)) } catch (e) { } };
    save();
    navigator.storage?.persist?.();

    /* ===== modal form ===== */
    function form(title, fields, cb, del) {
      const m = document.createElement('div'); m.className = 'modal';
      const f = x => x.t === 'select' ? `<select name="${x.k}">${x.o.map(o => `<option ${o == x.v ? 'selected' : ''}>${o}</option>`).join('')}</select>`
        : x.t === 'area' ? `<textarea name="${x.k}" rows="5">${esc(x.v)}</textarea>`
          : `<input name="${x.k}" type="${x.t || 'text'}" ${x.t === 'number' ? 'step="any" inputmode="decimal"' : ''} value="${esc(x.v)}">`;
      const cells = fields.map(x => `<label style="${x.h ? '' : ''}">${x.l}${f(x)}</label>`);
