<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Back to Fit</title>
  <meta name="theme-color" content="#1B1816">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Back to Fit">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg: #1B1816;
      --s: #26221E;
      --s2: #2E2822;
      --line: #3C352C;
      --ink: #EFE8DA;
      --dim: #BDB2A0;
      --faint: #9A907F;
      --iron: #C1443D;
      --brass: #B08D4F;
      --green: #7C9B5C;
      --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 var(--f);
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 0 calc(110px + env(safe-area-inset-bottom, 0px))
    }

    h1,
    h2,
    h3 {
      margin: 0 0 8px;
      font-weight: 700;
      letter-spacing: .01em
    }

    h1 {
      font-size: 22px
    }

    h2 {
      font-size: 18px
    }

    h3 {
      font-size: 15px
    }

    p {
      margin: 0 0 10px;
      color: var(--dim)
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 14px
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 14px 6px;
      max-width: 480px;
      margin: 0 auto
    }

    header h1::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--iron);
      margin-right: 8px
    }

    header span {
      font-size: 12px;
      color: var(--faint)
    }

    .panel {
      display: none
    }

    .panel.on {
      display: block
    }

    button {
      font-family: var(--f);
      cursor: pointer
    }

    input,
    select,
    textarea {
      font: 16px var(--f);
      width: 100%;
      background: var(--s2);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 8px;
      padding: 10px
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--iron)
    }

    /* nav */
    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: center;
      z-index: 30
    }

    nav div {
      display: flex;
      gap: 2px;
      background: rgba(38, 34, 30, .94);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4)
    }

    nav button {
      background: none;
      border: 0;
      color: var(--faint);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 20px;
      border-radius: 24px;
      font-size: 12px;
      min-height: 48px
    }

    nav svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8
    }

    nav button.on {
      background: var(--s2);
      color: var(--ink)
    }

    nav button.on svg {
      stroke: var(--iron)
    }

    .seg {
      display: flex;
      gap: 6px;
      background: var(--s2);
      border-radius: 24px;
      padding: 4px;
      margin: 4px 0 14px
    }

    .seg button {
      flex: 1;
      background: none;
      border: 0;
      color: var(--faint);
      font-size: 14px;
      font-weight: 600;
      padding: 11px 0;
      border-radius: 20px
    }

    .seg button.active {
      background: var(--ink);
      color: var(--bg)
    }

    .card {
      background: var(--s);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .sp {
      justify-content: space-between
    }

    .primary {
      width: 100%;
      background: var(--iron);
      color: #fff;
      border: 0;
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      border-radius: 10px;
      margin-top: 6px
    }
    
    .primary-small {
      width: auto;
      background: var(--iron);
      color: #fff;
      border: 0;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 10px;
      margin: 0;
    }

    .secondary {
      width: 100%;
      background: none;
      color: var(--dim);
      border: 1px solid var(--line);
      font-size: 14px;
      padding: 12px;
      border-radius: 10px;
      margin-top: 8px
    }

    .danger {
      color: var(--iron);
      border-color: var(--iron)
    }

    .link {
      border: 0;
      color: var(--brass);
      font-size: 13px;
      padding: 2px 7px;
      border-radius: 20px;
      background: rgba(176, 141, 79, .18);
    }

    .empty {
      color: var(--faint);
      text-align: center;
      padding: 22px 8px;
      font-size: 14px
    }

    /* folders + workout cards */
    .fh {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .fn {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: none;
      border: 0;
      color: var(--ink);
      font-size: 20px;
      font-weight: 700;
      padding: 12px 4px;
      min-height: 48px;
      text-align: left;
    }

    .fn small {
      font-size: 14px;
      font-weight: 400;
      color: var(--faint);
    }

    .fn .ch {
      display: inline-block;
      color: var(--faint);
      transition: transform 0.2s;
      margin-right: 4px;
    }

    .fn.open .ch {
      transform: rotate(90deg);
    }

    .fw {
    margin-bottom: 10px
    }

    .dots {
      width: 36px;
      height: 26px;
      flex: none;
      background: var(--s2);
      border: 1px solid var(--line);
      color: var(--dim);
      border-radius: 10px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .wgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 10px;
      margin: 4px 0 12px;
    }

    .wcard {
      cursor: pointer;
      min-width: 0;
      margin: 0;
      padding: 12px;
      border-radius: 16px;
      min-height: 130px;
    }

    .wcard h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .wcard .ds {
      color: var(--dim);
      font-size: 13px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .wcard .tag {
        display: inline-block;
        margin-top: 8px;
    }

    .wgrid .add {
      min-height: 130px;
      border-radius: 16px;
    }

    /* Workout popup */
    .ph {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      margin-bottom: 4px;
    }

    .ph h2 {
      margin: 0;
      text-align: center;
    }

    .prow {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }

    .prow small {
      display: block;
      color: var(--faint);
      font-size: 13px;
    }

    .add {
      background: none;
      border: 1px dashed var(--line);
      color: var(--dim);
      border-radius: 9px;
      padding: 12px;
      font-size: 14px;
      min-height: 46px;
      width: 100%
    }

    /* workout */
    .pill {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px));
      z-index: 20;
      background: var(--s2);
      border: 1px solid var(--iron);
      border-left: 0;
      border-right: 0;
      border-radius: 7px 7px 0 0;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 12px;
      align-items: center;
    }

    .ex {
      border-bottom: 1px solid var(--line);
      padding: 12px 0
    }

    .ex:last-of-type {
      border: 0
    }

    .ex .nm {
      background: none;
      border: 0;
      color: var(--ink);
      font-weight: 700;
      font-size: 16px;
      padding: 0;
      text-align: left
    }

    .meta {
      font-size: 13px;
      color: var(--faint);
      margin: 2px 0 8px
    }

    .sl {
      display: grid;
      grid-template-columns: 44px 1fr 1fr 44px;
      gap: 8px;
      align-items: center;
      padding: 4px 2px;
      border-radius: 8px;
      margin-bottom: 4px
    }

    .sl.hd span {
      font-size: 12px;
      color: var(--faint);
      text-align: center
    }

    .sl.d {
      background: rgba(124, 155, 92, .16)
    }

    .sl input {
      text-align: center;
      padding: 10px 4px
    }

    .b,
    .ck {
      height: 44px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--s2);
      color: var(--dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      user-select: none
    }

    .b.w {
      background: rgba(176, 141, 79, .2);
      border-color: var(--brass);
      color: var(--brass)
    }

    .ck.d {
      background: var(--green);
      border-color: var(--green);
      color: #fff
    }

    /* Rest timer between sets */
    .rest {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 30px;
      margin: 2px 0 4px;
      color: var(--brass);
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    .rest::before,
    .rest::after {
      content: "";
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(176, 141, 79, 0.22);
    }

    .rest.run {
      position: relative;
      height: 44px;
      justify-content: center;
      background: var(--s2);
      border-radius: 10px;
      overflow: hidden;
      color: #fff;
    }

    .rest.run::before,
    .rest.run::after {
      display: none;
    }

    .rest .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: var(--brass);
      transition: width 1s linear;
    }

    .rest.over .fill {
      background: var(--iron);
    }

    .rest.run span {
      position: relative;
    }

    /* history */
    .h {
      margin-bottom: 12px;
      position: relative
    }

    .h h3 {
      font-size: 17px;
      margin: 0
    }

    .h .dt {
      font-size: 13px;
      color: var(--faint);
      margin-bottom: 10px
    }

    .h .hr {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      color: var(--dim);
      padding: 3px 0
    }

    .h .hr b {
      color: var(--ink);
      white-space: nowrap
    }

    .h .ft {
      font-size: 13px;
      color: var(--faint);
      margin-top: 10px
    }

    .x {
      position: absolute;
      top: 6px;
      right: 6px;
      background: none;
      border: 0;
      color: var(--faint);
      font-size: 22px;
      width: 44px;
      height: 44px
    }

    /* eat */
    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 12px;
      padding-bottom: 4px
    }

    .chips button {
      flex: none;
      background: var(--s);
      border: 1px solid var(--line);
      color: var(--dim);
      border-radius: 20px;
      padding: 9px 15px;
      font-size: 14px
    }

    .chips button.on {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    .tag {
      font-size: 12px;
      padding: 2px 7px;
      border-radius: 20px;
      background: rgba(176, 141, 79, .18);
      color: var(--brass)
    }

    .meal {
      cursor: pointer;
      min-width: 0;
      box-sizing: border-box;
      border-radius: 16px;
      padding: 12px;
    }

    .meal h3 {
      margin: 0;
      font-size: 15px;
    }

    .meal .ds {
      color: var(--dim);
      font-size: 12px;
      margin: 6px 0;
    }

    .meal .nu {
      font-size: 12px;
      color: var(--faint);
    }

    #v-Meals .meal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 10px;
      align-items: start;
    }

    #v-Meals .meal {
      width: 100%;
      min-height: 155px;
      display: flex;
      flex-direction: column;
    }

    #v-Meals .meal > .row {
      flex-wrap: wrap;
      gap: 6px;
    }

    #v-Meals .meal .more {
      margin-top: 10px;
    }

    #v-Meals .meal.open {
      grid-column: 1 / -1;
      min-height: 0;
    }


    .meal .more {
      display: none;
      border-top: 1px solid var(--line);
      margin-top: 10px;
      padding-top: 10px;
      color: var(--ink);
      font-size: 14px
    }

    .meal.open .more {
      display: block
    }

    .meal .det { 
      white-space: pre-line; 
    }

    .si {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
      min-height: 50px
    }

    .si:last-child {
      border: 0
    }

    .si input {
      width: 22px;
      height: 22px;
      accent-color: var(--brass);
      flex: none;
      padding: 0
    }

    .si span {
      flex: 1
    }

    .si.c span {
      color: var(--faint);
      text-decoration: line-through
    }

    .si b {
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--dim)
    }

    /* Calendar popup */
    .sheet.cal {
        display: flex;
        flex-direction: column;
        height: 92vh;
        max-height: 92vh;
        overflow: hidden;
        padding-bottom: 0;
    }

    .cw,
    .cg {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
    }

    .cw span {
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        color: var(--dim);
        padding: 6px 0;
    }

    .cs {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 8px;
    }

    .cm {
        margin: 20px 4px 8px;
        font-size: 17px;
    }

    .cg {
        row-gap: 6px;
    }

    .cg i {
        display: block;
    }

    .cd {
        position: relative;
        width: 42px;
        height: 42px;
        margin: 0 auto;
        border: 0;
        border-radius: 50%;
        background: none;
        color: var(--ink);
        font-size: 16px;
    }

    .cd.has {
        background: rgba(193, 68, 61, 0.4);
    }

    .cd.today {
        background: var(--ink);
        color: var(--bg);
        font-weight: 700;
    }

    .cd.sel {
        outline: 2px solid var(--brass);
        outline-offset: 2px;
    }

    .cd em {
        position: absolute;
        top: -3px;
        right: -3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--green);
        color: #fff;
        font-style: normal;
        font-size: 10px;
        line-height: 16px;
        font-weight: 700;
    }

    .ci {
        border-top: 1px solid var(--line);
        padding: 12px 4px calc(12px + env(safe-area-inset-bottom, 0px));
        font-size: 14px;
        color: var(--dim);
        min-height: 68px;
    }

    /* Backup */
    .parts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 12px;
    }

    .part {
        background: var(--s2);
        border: 1px solid var(--line);
        color: var(--dim);
        border-radius: 10px;
        padding: 11px 14px;
        font-size: 14px;
        min-height: 44px;
    }

    .part.on {
        background: var(--iron);
        border-color: var(--iron);
        color: #fff;
    }

    /* progress */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr)
    }

    .stats div {
      text-align: center;
      border-left: 1px solid var(--line)
    }

    .stats div:first-child {
      border: 0
    }

    .stats b {
      display: block;
      font-size: 22px
    }

    .stats span {
      font-size: 13px;
      color: var(--faint)
    }

    .hm {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 6px;
      align-items: stretch
    }

    .hm .wd {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      gap: 3px;
      font-size: 10px;
      color: var(--faint);
      line-height: 1
    }

    .hm .wd span {
      display: flex;
      align-items: center
    }

    .hm .g {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      grid-template-columns: repeat(20, 1fr);
      grid-auto-flow: column;
      gap: 3px
    }

    .g i {
      aspect-ratio: 1;
      border-radius: 3px;
      background: var(--s2)
    }

    .l1 {
      background: rgba(193, 68, 61, .3) !important
    }

    .l2 {
      background: rgba(193, 68, 61, .55) !important
    }

    .l3 {
      background: rgba(193, 68, 61, .8) !important
    }

    .l4 {
      background: #E2574F !important
    }

    .nx {
      background: none !important
    }

    .mo {
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      gap: 3px;
      margin: 0 0 6px 38px;
      font-size: 11px;
      color: var(--faint);
      height: 14px
    }

    .mo span {
      white-space: nowrap;
      text-align: center;
    }

    .lg {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 13px;
      color: var(--faint)
    }

    .lg i {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: var(--s2);
      margin: 0 2px;
      vertical-align: -1px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px
    }

    td,
    th {
      text-align: left;
      padding: 10px 4px;
      border-bottom: 1px solid var(--line);
      color: var(--dim)
    }

    th {
      font-size: 12px;
      color: var(--faint)
    }

    .n {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    tr:last-child td {
      border: 0
    }

    /* modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center
    }

    .sheet {
      background: var(--s);
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow: auto;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px))
    }

    .sheet label {
      display: block;
      font-size: 13px;
      color: var(--faint);
      margin-bottom: 10px
    }

    .sheet label input,
    .sheet label select,
    .sheet label textarea {
      margin-top: 4px;
      color: var(--ink)
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }
  </style>
</head>

<body>
  <header>
    <h1>Back to Fit</h1><span id="today"></span>
  </header>
  <main class="wrap">

    <section id="p-train" class="panel">
      <div class="seg" id="seg-train">
        <button class="active" data-view="Workouts">Workouts</button>
        <button data-view="History">History</button>
      </div>
      <div id="v-Workouts"></div>
      <div id="v-History" style="display:none"></div>
    </section>

    <section id="p-eat" class="panel">
      <div class="seg" id="seg-eat">
        <button class="active" data-view="Meals">Meals</button>
        <button data-view="Shop">Shop</button>
      </div>
      <div id="v-Meals"></div>
      <div id="v-Shop" style="display:none"></div>
    </section>

    <section id="p-prog" class="panel on"></section>
  </main>

  <nav>
    <div>
      <button data-tab="train"><svg viewBox="0 0 24 24">
          <path d="M4 12h16" />
          <rect x="2" y="9" width="3" height="6" rx="1" />
          <rect x="19" y="9" width="3" height="6" rx="1" />
          <rect x="6" y="7" width="2.5" height="10" rx="1" />
          <rect x="15.5" y="7" width="2.5" height="10" rx="1" />
        </svg>Train</button>
      <button data-tab="eat"><svg viewBox="0 0 24 24">
          <path d="M7 2v8a2 2 0 0 0 4 0V2M9 10v12M15 2c0 3-2 4-2 7s2 3 2 3v10" />
        </svg>Eat</button>
      <button data-tab="prog" class="on"><svg viewBox="0 0 24 24">
          <polyline points="3 17 9 11 13 15 21 6" />
          <polyline points="14 6 21 6 21 13" />
        </svg>Progress</button>
    </div>
  </nav>

  <script>
    /* ===== helpers ===== */
    const $ = s => document.querySelector(s), uid = () => Math.random().toString(36).slice(2, 9);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
    const dk = d => { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') };
    const fmtDur = ms => { const m = Math.round(ms / 6e4), h = Math.floor(m / 60); return (h ? h + 'h ' : '') + (m % 60) + 'm' };
    const fmtVol = v => v >= 1000 ? +(v / 1000).toPrecision(3) + 'K' : Math.round(v) + '';
    const clock = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') };
    const nums = r => (String(r).match(/\d+/g) || [8]).map(Number);
    const hiR = r => Math.max(...nums(r)), loR = r => Math.min(...nums(r));

    /* ===== data ===== */
    const mk = (n, l) => ({ id: uid(), n, ex: l.map(([n, s, r, w, inc]) => ({ id: uid(), n, s, r, w, inc, h: 0, f: 0, last: null })) });
    function seed() {
      let bw = []; try { bw = JSON.parse(localStorage.getItem('rti:bw-log')) || [] } catch (e) { }
      return {
        v: 2, cur: 'EUR', open: null, sess: null, hist: [], bw,
        folders: [
          {
            n: 'Upper', w: [
              mk('Upper A', [['Barbell Bench Press', 4, '6-8', 30, 2.5], ['Lat Pulldown', 4, '8-10', 40, 5], ['Seated Cable Row', 3, '10-12', 32, 5], ['Dumbbell Overhead Press', 3, '8-10', 9, 2], ['Dumbbell Lateral Raise', 3, '12-15', 6, 2], ['Triceps Pushdown', 3, '10-12', 32, 5], ['Hanging Leg Raise', 3, '10-15', 0, 0]]),
              mk('Upper B', [['Incline Dumbbell Press', 4, '8-10', 10, 2], ['Pull-Up', 4, '6-10', 0, 0], ['Chest Dip', 3, '8-12', 0, 0], ['One-Arm Dumbbell Row', 3, '8-10', 16, 2], ['Machine Shoulder Press', 3, '10-12', 30, 5], ['Face Pull (Cable)', 3, '12-15', 20, 5], ['Preacher Curl', 3, '10-12', 20, 2.5], ['Plank (sec)', 3, '30-45', 0, 0]])]
          },
          {
            n: 'Lower', w: [
              mk('Lower A', [['Barbell Back Squat', 4, '6-8', 40, 5], ['Romanian Deadlift', 3, '8-10', 60, 5], ['Leg Press', 3, '10-12', 80, 10], ['Seated Leg Curl', 3, '10-12', 20, 5], ['Standing Calf Raise', 3, '12-15', 30, 5], ['Cable Crunch', 3, '12-15', 20, 5]]),
              mk('Lower B', [['Deadlift', 4, '5', 60, 5], ['Walking Lunge', 3, '10', 10, 2], ['Leg Extension', 3, '12-15', 25, 5], ['Seated Calf Raise', 3, '12-15', 20, 5], ['Weighted Plank (sec)', 3, '30-45', 0, 0]])]
          },
          { n: 'Folder 3', w: [] }, { n: 'Folder 4', w: [] }],
        meals: [
          { id: uid(), n: 'Breakfast', d: 'Eggs, oats, milk and a banana', tag: 'Breakfast', kcal: 555, p: 29, det: '2 eggs\n220ml half-fat milk\n50g oats\n1 banana' },
          { id: uid(), n: 'Chicken, rice & veg', d: 'Packable lunch. Swap the carb for variety.', tag: 'Lunch', kcal: 435, p: 41, det: '150g chicken breast (raw weight), cooked\n150g rice or potato, cooked\nVegetables + 1 tsp olive oil' },
          { id: uid(), n: 'Oat & quark shake', d: 'Blended backup for rushed mornings or after training', tag: 'Snack', kcal: 535, p: 33, det: '40g oats\n250ml milk\n1 banana\n150g low-fat quark\n1 tbsp peanut butter (optional)\n\nBlend oats + milk first for a minute, then add the rest.' }],
        shop: []
      };
    }
    let DB;
    try { DB = JSON.parse(localStorage.getItem('btf2')) || seed() } catch (e) { DB = seed() }
    const save = () => { try { localStorage.setItem('btf2', JSON.stringify(DB)) } catch (e) { } };
    save();
    navigator.storage?.persist?.();

    /* ===== modal form ===== */
    function form(title, fields, cb, del) {
      const m = document.createElement('div'); m.className = 'modal';
      const f = x => x.t === 'select' ? `<select name="${x.k}">${x.o.map(o => `<option ${o == x.v ? 'selected' : ''}>${o}</option>`).join('')}</select>`
        : x.t === 'area' ? `<textarea name="${x.k}" rows="5">${esc(x.v)}</textarea>`
          : `<input name="${x.k}" type="${x.t || 'text'}" ${x.t === 'number' ? 'step="any" inputmode="decimal"' : ''} value="${esc(x.v)}">`;
      const cells = fields.map(x => `<label style="${x.h ? '' : ''}">${x.l}${f(x)}</label>`);
      m.innerHTML = `<form class="sheet"><h2>${title}</h2>${cells.join('')}<button class="primary">Save</button>${del ? '<button type="button" class="secondary danger" data-del>Delete</button>' : ''}<button type="button" class="secondary" data-x>Cancel</button></form>`;
      document.body.appendChild(m);
      const close = () => m.remove();
      m.onclick = e => { if (e.target === m || e.target.dataset.x !== undefined) close(); if (e.target.dataset.del !== undefined && confirm('Delete this?')) { close(); del() } };
      m.querySelector('form').onsubmit = e => { e.preventDefault(); const o = {}; fields.forEach(x => { const v = m.querySelector(`[name=${x.k}]`).value; o[x.k] = x.t === 'number' ? (parseFloat(v) || 0) : v.trim() }); close(); cb(o) };
      const first = m.querySelector('input'); first && !first.value && first.focus();
    }

    /* ===== tabs / segments ===== */
    function tab(n) {
      document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === n));
      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + n));
      ({ train: renderTrain, eat: renderEat, prog: renderProg })[n]();
    }
    document.querySelectorAll('nav button').forEach(b => b.onclick = () => tab(b.dataset.tab));
    document.querySelectorAll('.seg').forEach(s => s.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      s.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      s.querySelectorAll('button').forEach(x => $('#v-' + x.dataset.view).style.display = x === b ? 'block' : 'none');
      if (s.id === 'seg-train') { inW = null; renderTrain() } else renderEat();
    });
    const view = s => $(s).querySelector('.active').dataset.view;

    /* ===== TRAIN: workouts ===== */
    let inW = null; // workout id currently open
    const find = id => { for (const f of DB.folders) { const w = f.w.find(w => w.id === id); if (w) return [f, w] } return [] };
    function renderTrain() { view('#seg-train') === 'History' ? renderHist() : inW ? renderWorkout() : renderFolders() }

    /* ---- folders ---- */
    function renderFolders() {
      $('#seg-train').style.display = 'flex';

      $('#v-Workouts').innerHTML = DB.folders.map((f, i) => {
        const isOpen = DB.open === i;
        const count = `${f.w.length} workout${f.w.length === 1 ? '' : 's'}`;

        const cards = f.w.map(w => {
          const running = DB.sess && DB.sess.wid === w.id;
          const names = w.ex.map(e => e.n).join(', ') || 'No exercises yet';
          return `
            <div class="card wcard" data-w="${w.id}">
              <h3>${esc(w.n)}</h3>
              <div class="ds">${esc(names)}</div>
              ${running ? '<span class="tag">In progress</span>' : ''}
            </div>`;
        }).join('');

        return `
          <div class="fw">
            <div class="fh">
              <button class="fn ${isOpen ? 'open' : ''}" data-f="${i}">
                <span><span class="ch">›</span> ${esc(f.n)}</span>
                <small>${count}</small>
              </button>
              <button class="dots" data-menu="${i}" aria-label="Folder options">•••</button>
            </div>
            ${isOpen ? `<div class="wgrid">${cards}<button class="add" data-add="${i}">+ Add workout</button></div>` : ''}
          </div>`;
      }).join('');
    }

    $('#v-Workouts').onclick = e => {
      if (inW) return;

      const menu = e.target.closest('[data-menu]');
      const add = e.target.closest('[data-add]');
      const card = e.target.closest('[data-w]');
      const fold = e.target.closest('[data-f]');

      if (menu) return folderMenu(+menu.dataset.menu);
      if (add) return addWorkout(+add.dataset.add);
      if (card) return workoutPopup(card.dataset.w);
      if (fold) {
        const i = +fold.dataset.f;
        DB.open = DB.open === i ? null : i;
        save();
        renderFolders();
      }
    };

    /* small action sheet: sheet('Title', [{label, run, danger}]) */
    function sheet(title, actions) {
      const m = document.createElement('div');
      m.className = 'modal';
      m.innerHTML = `
        <div class="sheet">
          <h2>${esc(title)}</h2>
          ${actions.map((a, i) => `<button class="secondary ${a.danger ? 'danger' : ''}" data-i="${i}">${a.label}</button>`).join('')}
          <button class="secondary" data-x>Cancel</button>
        </div>`;
      document.body.appendChild(m);
      m.onclick = e => {
        if (e.target === m || e.target.dataset.x !== undefined) return m.remove();
        const b = e.target.closest('[data-i]');
        if (b) { m.remove(); actions[+b.dataset.i].run(); }
      };
    }

    function folderMenu(i) {
      const f = DB.folders[i];
      const actions = [
        { label: 'Rename folder', run: () => renameFolder(i) },
        { label: 'Add workout', run: () => addWorkout(i) }
      ];
      if (f.w.length) actions.push({ label: 'Delete all workouts', danger: true, run: () => deleteAll(i) });
      sheet(f.n, actions);
    }

    function renameFolder(i) {
      form('Rename folder', [{ k: 'n', l: 'Name', v: DB.folders[i].n }], o => {
        if (!o.n) return;
        DB.folders[i].n = o.n;
        save();
        renderFolders();
      });
    }

    function addWorkout(i) {
      form('New workout', [{ k: 'n', l: 'Name', v: '' }], o => {
        if (!o.n) return;
        DB.folders[i].w.push({ id: uid(), n: o.n, ex: [] });
        DB.open = i;
        save();
        renderFolders();
      });
    }

    function deleteAll(i) {
      const f = DB.folders[i];
      if (!confirm(`Delete all ${f.w.length} workouts in "${f.n}"? Your history is kept. This can't be undone.`)) return;
      if (DB.sess && f.w.some(w => w.id === DB.sess.wid)) DB.sess = null;
      f.w = [];
      save();
      renderFolders();
    }

    /* ---- workout preview popup ---- */
    function workoutPopup(id) {
      const [f, w] = find(id);
      if (!w) return;

      const last = DB.hist.find(h => h.n === w.n);
      const days = last ? Math.floor((Date.now() - last.t0) / 864e5) : null;
      const lastText = !last ? 'never' : days === 0 ? 'today' : days === 1 ? 'yesterday' : `${days} days ago`;
      const running = DB.sess && DB.sess.wid === w.id;
      const refresh = () => { renderFolders(); workoutPopup(w.id); };

      const rows = w.ex.map(ex => `
        <div class="prow" data-e="${ex.id}">
          <b>${ex.s} × ${esc(ex.n)}</b>
          <small>${esc(ex.r)} reps${ex.w ? ' · ' + ex.w + ' kg' : ''}</small>
        </div>`).join('');

      const m = document.createElement('div');
      m.className = 'modal';
      m.innerHTML = `
        <div class="sheet">
          <div class="ph">
            <button class="link" data-x aria-label="Close" style="font-size:22px">✕</button>
            <h2>${esc(w.n)}</h2>
            <button class="link" data-edit>Edit</button>
          </div>
          <p>Last performed: ${lastText}</p>
          ${rows || '<div class="empty">No exercises yet. Tap Edit to add some.</div>'}
          ${w.ex.length ? `<button class="primary" data-start style="margin-top:14px">${running ? 'Resume workout' : 'Start workout'}</button>` : ''}
        </div>`;
      document.body.appendChild(m);

      m.onclick = e => {
        if (e.target === m || e.target.closest('[data-x]')) return m.remove();

        if (e.target.closest('[data-start]')) {
          if (startWorkout(w.id)) m.remove();
          return;
        }
        if (e.target.closest('[data-edit]')) {
          m.remove();
          return editWorkout(w, f, refresh);
        }
        const row = e.target.closest('[data-e]');
        if (row) {
          m.remove();
          exForm(w, w.ex.find(x => x.id === row.dataset.e), refresh);
        }
      };
    }

    function editWorkout(w, f, refresh) {
      sheet(w.n, [
        {
          label: 'Rename workout',
          run: () => form('Rename workout', [{ k: 'n', l: 'Name', v: w.n }], o => {
            if (o.n) { w.n = o.n; save(); }
            refresh();
          })
        },
        { label: 'Add exercise', run: () => exForm(w, null, refresh) },
        {
          label: 'Delete workout',
          danger: true,
          run: () => {
            if (!confirm(`Delete "${w.n}"?`)) return refresh();
            f.w = f.w.filter(x => x !== w);
            if (DB.sess?.wid === w.id) DB.sess = null;
            save();
            renderFolders();
          }
        }
      ]);
    }

    function startWorkout(id) {
      if (DB.sess && DB.sess.wid !== id && !confirm('Another workout is in progress. Discard it and start this one?')) return false;
      if (!DB.sess || DB.sess.wid !== id) DB.sess = { wid: id, t0: null, rest: null, s: {} };
      inW = id;
      save();
      renderWorkout();
      return true;
    }

    /* active workout */
    const sets = ex => { const S = DB.sess.s; if (!S[ex.id]) S[ex.id] = Array.from({ length: ex.s }, () => ({ k: ex.w, r: '', d: 0, wu: 0 })); return S[ex.id] };

    /* ---- rest timer helpers ---- */
    function restRow(ex, i) {
      const R = DB.sess.rest;
      const active = R && R.e === ex.id && R.i === i;
      if (!active) return `<div class="rest" data-act="rest"><span>${clock(ex.rest || 90)}</span></div>`;
      return `<div class="rest run" data-act="rest"><div class="fill"></div><span></span></div>`;
    }

    function parseTime(str) {
      const [a, b] = String(str).split(':');
      return b === undefined ? Math.round(+a) || 0 : Math.round(+a * 60 + +b) || 0;
    }

    function editRest(w, exId) {
      const ex = w.ex.find(x => x.id === exId);
      form('Rest timer', [{ k: 't', l: 'Rest between sets (e.g. 1:30, or 90 for seconds)', v: clock(ex.rest || 90) }], o => {
        const sec = parseTime(o.t);
        if (!sec) return;
        ex.rest = sec;
        if (DB.sess.rest && DB.sess.rest.e === ex.id) DB.sess.rest.total = sec;
        save();
        renderWorkout();
      });
    }

    function renderWorkout() {
      const [f, w] = find(inW); if (!w) { inW = null; return renderFolders() }
      $('#seg-train').style.display = 'none';
      if (DB.sess.rest && !DB.sess.rest.e) DB.sess.rest = null; // timer saved in the old format

      const exercises = w.ex.map(ex => {
        const S = sets(ex), L = ex.last;
        const lastText = L ? ' · last: ' + L.map(s => (s.k ? s.k + '×' : 'BW×') + s.r).join(', ') : '';

        const rows = S.map((s, i) => `
          <div class="sl ${s.d ? 'd' : ''}" data-i="${i}">
            <div class="b ${s.wu ? 'w' : ''}" data-act="wu">${s.wu ? 'W' : i + 1}</div>
            <input type="number" inputmode="decimal" step="any" data-f="k" value="${s.k || ''}" placeholder="BW">
            <input type="number" inputmode="numeric" data-f="r" value="${s.r}" placeholder="${L && L[i] ? L[i].r : loR(ex.r)}">
            <div class="ck ${s.d ? 'd' : ''}" data-act="ck">✓</div>
          </div>
          ${restRow(ex, i)}`).join('');

        return `<div class="ex" data-e="${ex.id}"><button class="nm" data-edit="${ex.id}">${esc(ex.n)}</button>
        <div class="meta">${ex.s} × ${esc(ex.r)}${lastText}</div>
        <div class="sl hd"><span>Set</span><span>kg</span><span>Reps</span><span>✓</span></div>
        ${rows}
        <button class="add" data-act="add" style="margin-top:4px">+ Add set</button></div>`;
      }).join('');

      $('#v-Workouts').innerHTML = `
      <div class="row sp" style="align-items:baseline"><button class="link" id="back">‹ Back</button><h2>${esc(w.n)}</h2><button class="link" id="wmenu">Edit workout</button></div>
      <div class="pill"><span id="tm">⏱ 0:00</span><button class="primary-small" id="fin">Finish</button></div>
      <div class="card" style="padding-top:2px">${exercises || '<div class="empty">No exercises yet.</div>'}
      </div>
      <button class="add" id="addex" style="margin-top:8px">+ Add exercise</button>
      <button class="secondary danger" id="disc">Discard session</button>`;
      keepAwake(); tick();
    }
    function keepAwake() { try { navigator.wakeLock?.request('screen').catch(() => { }) } catch (e) { } }
    document.addEventListener('visibilitychange', () => { if (!document.hidden && inW) keepAwake() });
    setInterval(() => { if (inW) tick() }, 1000);

    function tick() {
      const S = DB.sess;
      if (!S || !$('#tm')) return;

      $('#tm').textContent = '⏱ ' + (S.t0 ? clock((Date.now() - S.t0) / 1000) : '0:00');

      const bar = document.querySelector('.rest.run');
      const R = S.rest;
      if (!bar || !R || !R.e) return;

      const left = R.total - (Date.now() - R.t) / 1000;
      bar.querySelector('.fill').style.width = (left > 0 ? (left / R.total) * 100 : 100) + '%';
      bar.querySelector('span').textContent = left > 0 ? clock(Math.ceil(left)) : '+' + clock(-left);
      bar.classList.toggle('over', left <= 0);

      if (left <= 0 && !R.done) {      // buzz once when the time is up (Android only)
        R.done = true;
        save();
        navigator.vibrate?.([200, 100, 200]);
      }
    }

    $('#v-Workouts').addEventListener('click', e => {
      if (!inW) return; const t = e.target.closest('button,[data-act]'); if (!t) return;
      const [f, w] = find(inW);
      if (t.id === 'back') { inW = null; renderFolders(); $('#seg-train').style.display = 'flex' }
      else if (t.id === 'wmenu') form('Edit workout', [{ k: 'n', l: 'Name', v: w.n }], o => { if (o.n) { w.n = o.n; save(); renderWorkout() } }, () => { f.w = f.w.filter(x => x !== w); if (DB.sess?.wid === w.id) DB.sess = null; inW = null; save(); renderFolders(); $('#seg-train').style.display = 'flex' });
      else if (t.id === 'addex') exForm(w, null);
      else if (t.dataset.edit) exForm(w, w.ex.find(x => x.id === t.dataset.edit));
      else if (t.id === 'disc') { if (confirm('Discard this session? Logged sets will be lost.')) { DB.sess = null; inW = null; save(); renderFolders(); $('#seg-train').style.display = 'flex' } }
      else if (t.id === 'fin') finish(w);
      else if (t.dataset.act === 'rest') editRest(w, t.closest('.ex').dataset.e);
      else if (t.dataset.act) {
        const ex = w.ex.find(x => x.id === t.closest('.ex').dataset.e), S = sets(ex), i = +t.closest('.sl').dataset.i, s = S[i];
        if (t.dataset.act === 'add') { S.push({ k: S.length ? S[S.length - 1].k : ex.w, r: '', d: 0, wu: 0 }); save(); renderWorkout() }
        else if (t.dataset.act === 'wu') { s.wu = s.wu ? 0 : 1; save(); renderWorkout() }
        else {
          s.d = s.d ? 0 : 1;
          const R = DB.sess.rest;
          if (s.d) {
            if (s.r === '') s.r = ex.last && ex.last[i] ? ex.last[i].r : loR(ex.r);
            if (!DB.sess.t0) DB.sess.t0 = Date.now();
            DB.sess.rest = { e: ex.id, i, t: Date.now(), total: ex.rest || 90 };
          } else if (R && R.e === ex.id && R.i === i) {
            DB.sess.rest = null;
          }
          save(); renderWorkout();
        }
      }
    });
    $('#v-Workouts').addEventListener('change', e => {
      const i = e.target; if (!i.dataset.f || !inW) return;
      const [f, w] = find(inW), ex = w.ex.find(x => x.id === i.closest('.ex').dataset.e);
      sets(ex)[+i.closest('.sl').dataset.i][i.dataset.f] = i.value === '' ? '' : parseFloat(i.value); save();
    });
    function exForm(w, ex, after = renderWorkout) {
      form(ex ? 'Edit exercise' : 'Add exercise', [{ k: 'n', l: 'Name', v: ex?.n || '' }, { k: 's', l: 'Sets', t: 'number', v: ex?.s || 3 }, { k: 'r', l: 'Rep range (e.g. 8-10)', v: ex?.r || '8-10' }, { k: 'w', l: 'Weight (kg, 0 = bodyweight)', t: 'number', v: ex?.w ?? 0 }, { k: 'inc', l: 'Jump when progressing (kg)', t: 'number', v: ex?.inc ?? 2.5 }, { k: 'rest', l: 'Rest between sets (seconds)', t: 'number', v: ex?.rest || 90 }], o => {
        if (!o.n) return; o.s = Math.max(1, Math.round(o.s));
        if (ex) { Object.assign(ex, o); if (DB.sess) delete DB.sess.s[ex.id] } else w.ex.push({ id: uid(), ...o, h: 0, f: 0, last: null });
        save(); after();
      }, ex ? () => { w.ex = w.ex.filter(x => x !== ex); if (DB.sess) delete DB.sess.s[ex.id]; save(); after() } : null);
    }
    
    function finish(w) {
      const S = DB.sess, ents = []; let vol = 0;
      w.ex.forEach(ex => {
        const done = (S.s[ex.id] || []).filter(s => s.d); if (!done.length) return;
        const work = done.filter(s => !s.wu);
        ents.push({ n: ex.n, sets: done.map(s => ({ k: s.k || 0, r: s.r || 0, wu: s.wu })) });
        work.forEach(s => vol += (s.k || 0) * (s.r || 0));
        if (!work.length) return;
        ex.last = done.map(s => ({ k: s.k || 0, r: s.r || 0 }));
        if (work[work.length - 1].k) ex.w = work[work.length - 1].k;
        const hit = work.length >= ex.s && work.every(s => s.r >= hiR(ex.r)), miss = work.some(s => s.r < loR(ex.r));
        ex.h = hit ? (ex.h || 0) + 1 : 0; ex.f = miss ? (ex.f || 0) + 1 : 0;
        if (ex.h >= 2) { ex.w = Math.round((ex.w + ex.inc) * 2) / 2; ex.h = 0 }
        else if (ex.f >= 2 && ex.w > 0) { ex.w = Math.round(ex.w * .9 * 2) / 2; ex.f = 0 }
      });
      if (!ents.length) return alert('Tick at least one set before finishing.');
      DB.hist.unshift({ id: uid(), n: w.n, t0: S.t0, t1: Date.now(), ex: ents, vol });
      DB.sess = null; inW = null; save();
      $('#seg-train').style.display = 'flex';
      document.querySelectorAll('#seg-train button').forEach(b => b.classList.toggle('active', b.dataset.view === 'History'));
      $('#v-Workouts').style.display = 'none'; $('#v-History').style.display = 'block'; renderHist();

    function mergeWorkouts(folders) {
      const sig = list => list.map(e => String(e.n).trim().toLowerCase()).join('|');
      let added = 0, skipped = 0;

      folders.forEach((f, i) => {
        if (!f || !Array.isArray(f.w)) return;
        const target = DB.folders.find(x => same(x.n, f.n)) || DB.folders[i] || DB.folders[0];   // match by folder name, else by position

        f.w.forEach(w => {
          if (!w || !w.n || !Array.isArray(w.ex)) return;
          const ex = w.ex.filter(e => e && e.n).map(e => ({
            id: uid(), n: String(e.n), s: +e.s || 3, r: String(e.r || '8-10'), w: +e.w || 0, inc: +e.inc || 0,
            rest: +e.rest || 90, h: +e.h || 0, f: +e.f || 0, last: Array.isArray(e.last) ? e.last : null
          }));

          const named = target.w.filter(x => same(x.n, w.n) || same(x.n, w.n + ' (imported)'));
          if (named.some(x => sig(x.ex) === sig(ex))) { skipped++; return; }          // already have this exact workout

          const clash = target.w.some(x => same(x.n, w.n));                            // same name, different exercises
          target.w.push({ id: uid(), n: clash ? w.n + ' (imported)' : w.n, ex });
          added++;
        });
      });
      return line('Workouts', added, skipped);
    }

    function mergeHistory(list) {
      const seen = new Set(DB.hist.flatMap(h => [h.id, h.t0]));
      let added = 0;
      list.forEach(h => {
        const ok = h && typeof h.t0 === 'number' && typeof h.t1 === 'number' && Array.isArray(h.ex);

        DB.hist.push({ ...h, vol: +h.vol || 0 });
        seen.add(h.id); seen.add(h.t0); added++;

      DB.hist.sort((a, b) => b.t0 - a.t0);
      return line('History', added, list.length - added);
    }

    /* ---- import history from Strong / Hevy (CSV) ---- */
    function parseCSV(text) {
      const rows = []; let row = [], cell = '', q = false;
      text = text.replace(/^\uFEFF/, '');
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
          if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
          else cell += c;
        } else if (c === '"') q = true;
        else if (c === ',') { row.push(cell); cell = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(cell); cell = '';
          if (row.some(x => x !== '')) rows.push(row);
          row = [];
        } else cell += c;
      }
      row.push(cell);
      if (row.some(x => x !== '')) rows.push(row);
      const head = (rows.shift() || []).map(h => h.trim());
      return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
    }

    const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
    function parseWhen(s) {
      let m = s.match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);            // 2025-03-15 09:25:12  (Strong)
      if (m) return new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)).getTime();
      m = s.match(/^(\d{1,2}) ([A-Za-z]{3})\w* (\d{4}),? (\d{1,2}):(\d{2})/);                   // 15 Mar 2025, 09:25  (Hevy)
      if (m) { const mo = MONTHS.indexOf(m[2].toLowerCase()); if (mo >= 0) return new Date(+m[3], mo, +m[1], +m[4], +m[5]).getTime(); }
      const t = Date.parse(s);
      return isNaN(t) ? null : t;
    }

    function parseDuration(s) {                                                                 // "1h 13m", "45m", "1h"
      const g = re => +(String(s).match(re)?.[1] || 0);
      return ((g(/(\d+)\s*h/) * 60 + g(/(\d+)\s*m/)) * 60 + g(/(\d+)\s*s/)) * 1000;
    }

    function readWorkouts(rows, strong, unit) {
      const factor = unit === 'lb' ? 0.45359237 : 1;
      const groups = new Map();

      rows.forEach(r => {
        const t0 = parseWhen((strong ? r['Date'] : r['start_time']) || '');
        const exName = strong ? r['Exercise Name'] : r['exercise_title'];
        if (t0 === null || !exName) return;

        let warm, weight, reps, sec;
        if (strong) {
          if (r['Set Order'] === 'Rest Timer') return;                                          // not a real set
          warm = r['Set Order'] === 'W';
          weight = parseFloat(r['Weight']); reps = parseFloat(r['Reps']); sec = parseFloat(r['Seconds']);
        } else {
          warm = r['set_type'] === 'warmup';
          weight = parseFloat('weight_kg' in r ? r['weight_kg'] : r['weight_lbs']);
          reps = parseFloat(r['reps']); sec = parseFloat(r['duration_seconds']);
        }
        const timed = !(reps > 0) && sec > 0;
        const value = Math.round(reps > 0 ? reps : sec || 0);
        if (!(value > 0)) return;

        const name = ((strong ? r['Workout Name'] : r['title']) || 'Workout').trim();
        const key = t0 + '|' + name;
        if (!groups.has(key)) {
          const dur = strong ? parseDuration(r['Duration']) : (parseWhen(r['end_time'] || '') ?? t0) - t0;
          groups.set(key, { t0, name, dur, ex: new Map() });
        }
        const g = groups.get(key);
        if (!g.ex.has(exName)) g.ex.set(exName, []);
        g.ex.get(exName).push({ k: Math.round((weight || 0) * factor * 100) / 100, r: value, wu: warm ? 1 : 0, timed });
      });

      return [...groups.values()].map(g => {
        let vol = 0;
        const ex = [...g.ex].map(([n, sets]) => {
          sets.forEach(s => { if (!s.wu && !s.timed) vol += s.k * s.r; });
          const allTimed = sets.every(s => s.timed);
          return { n: allTimed ? n + ' (sec)' : n, sets: sets.map(s => ({ k: s.k, r: s.r, wu: s.wu })) };
        });
        return { id: 'import-' + g.t0, n: g.name, t0: g.t0, t1: g.t0 + Math.max(g.dur || 0, 0), ex, vol: Math.round(vol) };
      }).filter(h => h.ex.length);
    }

    function importCSV(file) {
      file.text().then(text => {
        let rows = [];
        try { rows = parseCSV(text); } catch (e) { }
        const head = rows[0] || {};
        const strong = 'Workout Name' in head && 'Exercise Name' in head;
        const hevy = 'exercise_title' in head && 'start_time' in head;
        if (!strong && !hevy) return alert("That doesn't look like a Strong or Hevy export.");

        const go = unit => {
          const list = readWorkouts(rows, strong, unit);
          if (!list.length) return alert('No workouts found in that file.');

          const day = t => new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
          const first = Math.min(...list.map(h => h.t0));
          const latest = list.reduce((a, h) => h.t0 > a.t0 ? h : a);
          const ex = latest.ex[0];
          const top = ex.sets.filter(s => !s.wu).sort((a, b) => b.k * b.r - a.k * a.r)[0] || ex.sets[0];

          const ok = confirm(
            `Found ${list.length} workouts (${day(first)} to ${day(latest.t0)}).\n\n` +
            `Most recent: ${latest.n}\n${ex.n}: ${top.k} kg × ${top.r}\n\n` +
            `Does that weight look right? Import these into your history?`);
          if (!ok) return;

          const result = mergeHistory(list);
          save();
          renderProg();
          alert('Import finished\n\n' + result);
        };

        if (hevy) go('weight_lbs' in head ? 'lb' : 'kg');       // Hevy names the unit in the column header
        else form('Import from Strong', [{ k: 'u', l: 'Which unit does this file use for weight?', t: 'select', o: ['kg', 'lb'], v: 'kg' }], o => go(o.u));
      });
    }

    /* ===== PROGRESS ===== */
    function renderProg() {
      const H = DB.hist, n = H.length, ms = H.reduce((a, h) => a + (h.t1 - h.t0), 0), vol = H.reduce((a, h) => a + h.vol, 0);
      const byDay = {}; H.forEach(h => byDay[dk(h.t0)] = (byDay[dk(h.t0)] || 0) + h.vol);
      const max = Math.max(1, ...Object.values(byDay)), W = 20, now = new Date(), start = new Date(now);
      start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - start.getDay() - (W - 1) * 7);
      let cells = '', months = ''; const weekMonth = [];
      for (let c = 0; c < W; c++) {
        const sun = new Date(start); sun.setDate(start.getDate() + c * 7);
        const thu = new Date(sun); thu.setDate(sun.getDate() + 4); weekMonth.push(thu);   // a week belongs to the month its Thursday is in
        for (let r = 0; r < 7; r++) {
          const d = new Date(sun); d.setDate(sun.getDate() + r);
          if (d > now) { cells += '<i class="nx"></i>'; continue }
          const v = byDay[dk(d)] || 0, l = !v ? 0 : v / max >= .75 ? 4 : v / max >= .5 ? 3 : v / max >= .25 ? 2 : 1;
          cells += `<i class="${l ? 'l' + l : ''}" title="${dk(d)}"></i>`;
        }
      }
      for (let c = 0; c < W;) {                       // one label per month, centred over its weeks
        let end = c; while (end + 1 < W && weekMonth[end + 1].getMonth() === weekMonth[c].getMonth()) end++;
        const len = end - c + 1;
        if (len >= 2) months += `<span style="grid-column:${c + 1}/span ${len}">${weekMonth[c].toLocaleDateString(undefined, { month: 'short' })}</span>`;
        c = end + 1;
      }
      const log = DB.bw.slice().reverse().slice(0, 12);
      const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
        .map(d => `<span>${d}</span>`)
        .join('');

      const legend = 'Less <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> More';
      const avg = n ? fmtDur(ms / n) : '–';

      const bwRows = log.map((e, i) => {
        const prev = log[i + 1];
        const diff = prev ? e.weight - prev.weight : null;
        const change = diff == null ? '–' : (diff > 0 ? '+' : '') + diff.toFixed(1);
        return `<tr data-d="${e.date}">
          <td>${e.date}</td>
          <td class="n">${e.weight} kg</td>
          <td class="n">${change}</td>
        </tr>`;
      }).join('');

      const bwTable = log.length
        ? `<tr><th>Date</th><th class="n">Weight</th><th class="n">Change</th></tr>${bwRows}`
        : '<tr><td class="empty">No entries yet. Log your first weigh-in above.</td></tr>';

      const bwHint = log.length
        ? '<p style="font-size:12px;color:var(--faint);margin:8px 0 0">Tap an entry to delete it.</p>'
        : '';

      $('#p-prog').innerHTML = `
        <div class="card">
          <h2>Overview</h2>
          <div class="stats">
            <div><b>${n}</b><span>Workouts</span></div>
            <div><b>${fmtDur(ms)}</b><span>Time spent</span></div>
            <div><b>${fmtVol(vol)}</b><span>Volume (kg)</span></div>
          </div>
        </div>

        <div class="card" data-cal style="cursor:pointer">
          <div class="row sp" style="margin-bottom:8px"><h3 style="margin:0">Activity</h3><span style="color:var(--faint);font-size:13px">Calendar ›</span></div>
          <div class="mo">${months}</div>
          <div class="hm">
            <div class="wd">${weekdays}</div>
            <div class="g">${cells}</div>
          </div>
          <div class="lg">
            <span>Avg: ${avg}</span>
            <span>${legend}</span>
          </div>
        </div>

        <div class="card">
          <h2>Bodyweight</h2>
          <div class="two" style="grid-template-columns:1.3fr 0.5fr auto;align-items:center">
            <input type="date" id="bd" value="${dk(Date.now())}" style="-webkit-appearance:none">
            <input type="number" id="bk" inputmode="decimal" step="0.1" placeholder="kg">
            <button class="primary-small" id="bl">Log</button>
          </div>
          <table style="margin-top:8px">${bwTable}</table>
          ${bwHint}
        </div>

        <div class="card">
          <h3>Backup</h3>
          <p>Pick what to export or import. Importing adds to what you already have and skips duplicates.</p>
          <div class="parts">${PARTS.map(([k, label]) => `<button class="part ${chosen[k] ? 'on' : ''}" data-part="${k}">${label}</button>`).join('')}</div>
          <div class="two">
            <button class="secondary" id="exp" style="margin:0">Export</button>
            <button class="secondary" id="imp" style="margin:0">Import</button>
          </div>
          <input type="file" id="file" accept="application/json" hidden>
          <button class="secondary" id="csvbtn" style="margin:12px 0 0">Import history from Strong / Hevy (CSV)</button>
          <input type="file" id="csv" accept=".csv,text/csv" hidden>
        </div>`;
    }
    $('#p-prog').onclick = e => {
      const t = e.target;
      if (t.closest('[data-cal]')) return calendarPopup();
      const part = t.closest('[data-part]');
      if (part) { const k = part.dataset.part; chosen[k] = chosen[k] ? 0 : 1; part.classList.toggle('on', !!chosen[k]); return }
      if (t.id === 'bl') { const date = $('#bd').value, weight = parseFloat($('#bk').value); if (!date || !weight) return; DB.bw = DB.bw.filter(x => x.date !== date); DB.bw.push({ date, weight }); DB.bw.sort((a, b) => a.date.localeCompare(b.date)); save(); renderProg() }
      else if (t.closest('tr[data-d]') && confirm('Delete this entry?')) { DB.bw = DB.bw.filter(x => x.date !== t.closest('tr').dataset.d); save(); renderProg() }
      else if (t.id === 'exp') exportData();
      else if (t.id === 'imp') $('#file').click();
      else if (t.id === 'csvbtn') $('#csv').click();
    };
    $('#p-prog').onchange = e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      if (e.target.id === 'file') importFile(f);
      if (e.target.id === 'csv') importCSV(f);
      e.target.value = '';
    };

    /* ===== init ===== */
    $('#today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    let tapped=false;
    // service worker update prompt. Basically show update button if a new version is available.
    function askUpdate(w){
      if($('#upd'))return;
      const b=document.createElement('button');b.id='upd';
      b.textContent='New version available. Tap to update';
      b.style.cssText='position:fixed;left:14px;right:14px;max-width:452px;margin:0 auto;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--iron);color:#fff;border:0;border-radius:12px;padding:14px;font:600 15px var(--f);box-shadow:0 8px 24px rgba(0,0,0,.4)';
      b.onclick=()=>{tapped=true;w.postMessage('SKIP_WAITING')};
      document.body.appendChild(b);
    }
    if('serviceWorker' in navigator){
      addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(reg=>{
        if(reg.waiting&&navigator.serviceWorker.controller)askUpdate(reg.waiting);
        reg.addEventListener('updatefound',()=>{
          const w=reg.installing;
          w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)askUpdate(w)});
        });
      }).catch(()=>{}));
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(tapped)location.reload()});
    }
    if (DB.sess && find(DB.sess.wid)[1]) inW = DB.sess.wid;
    renderProg();
  </script>
</body>

</html>
