<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Back to Fit</title>
  <meta name="theme-color" content="#1B1816">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Back to Fit">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/train.css">
  <link rel="stylesheet" href="css/eat.css">
  <link rel="stylesheet" href="css/progress.css">

  <script type="module" src="js/main.js"></script>
</head>

<body>
  <header class="app-header">
    <h1>Back to Fit</h1>
    <span id="today-date"></span>
  </header>

  <main class="page-content">

    <!-- Train: folders + active workout, or history -->
    <section id="train-screen" class="screen">
      <div class="segmented" id="train-segments">
        <button class="active" data-view="workouts">Workouts</button>
        <button data-view="history">History</button>
      </div>
      <div id="workouts-view"></div>
      <div id="history-view" hidden></div>
    </section>

    <!-- Eat: meals or shopping list -->
    <section id="eat-screen" class="screen">
      <div class="segmented" id="eat-segments">
        <button class="active" data-view="meals">Meals</button>
        <button data-view="shopping">Shop</button>
      </div>
      <div id="meals-view"></div>
      <div id="shopping-view" hidden></div>
    </section>

    <!-- Progress: overview, heatmap, bodyweight, backup (drawn by js/progress.js) -->
    <section id="progress-screen" class="screen active"></section>
  </main>

  <nav class="tab-bar">
    <div class="tab-bar-inner">
      <button class="tab-button" data-tab="train">
        <svg viewBox="0 0 24 24">
          <path d="M4 12h16" />
          <rect x="2" y="9" width="3" height="6" rx="1" />
          <rect x="19" y="9" width="3" height="6" rx="1" />
          <rect x="6" y="7" width="2.5" height="10" rx="1" />
          <rect x="15.5" y="7" width="2.5" height="10" rx="1" />
        </svg>Train</button>
      <button class="tab-button" data-tab="eat">
        <svg viewBox="0 0 24 24">
          <path d="M7 2v8a2 2 0 0 0 4 0V2M9 10v12M15 2c0 3-2 4-2 7s2 3 2 3v10" />
        </svg>Eat</button>
      <button class="tab-button active" data-tab="progress">
        <svg viewBox="0 0 24 24">
          <polyline points="3 17 9 11 13 15 21 6" />
          <polyline points="14 6 21 6 21 13" />
        </svg>Progress</button>
    </div>
  </nav>
</body>

</html>
